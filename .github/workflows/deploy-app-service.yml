name: CD - Deploy to Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "azure-functions/**"
      - "docs/**"
      - "*.md"

jobs:
  build-and-deploy:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    if: github.repository == 'Janhavi92691/AI-Interview-coach'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Gate
        run: npm test

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: "AI Interview Coach"
          AI_PROVIDER: "mock"

      - name: Package Standalone Artifacts
        run: |
          mkdir -p deploy-pkg
          cp -r .next/standalone/* deploy-pkg/
          cp -r .next/static deploy-pkg/.next/static
          cp -r public deploy-pkg/public 2>/dev/null || true
          cd deploy-pkg && zip -r ../release.zip .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || 'app-interview-coach-janhavi' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
        continue-on-error: true # Allows CI pipeline to succeed gracefully even before publish profile is added
