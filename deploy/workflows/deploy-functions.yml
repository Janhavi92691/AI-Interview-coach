name: CD - Deploy Azure Function App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "azure-functions/**"

jobs:
  build-and-deploy-functions:
    name: Package & Deploy Serverless Workers
    runs-on: ubuntu-latest
    if: github.repository == 'Janhavi92691/AI-Interview-coach'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Function Worker Dependencies
        run: |
          cd azure-functions
          npm install --production

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME || 'func-interview-coach-janhavi' }}
          package: "azure-functions"
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        continue-on-error: true # Gracefully succeeds until publish profile secret is configured
