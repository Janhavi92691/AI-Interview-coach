name: CI - Quality & Test Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Automated Unit & Integration Tests
        run: npm test

      - name: AI Contract & Rubric Smoke Suite
        run: npm run smoke:ai

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: "AI Interview Coach"
          AI_PROVIDER: "mock"
